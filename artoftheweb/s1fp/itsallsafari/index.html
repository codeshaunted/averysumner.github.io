<!DOCTYPE html>

<head>
    <title>
        What browser should I use?
    </title>
    <link rel="stylesheet" href="../areyouonaniphone/style.css">
    <style>
        #safari-logo {
            width: 25%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="modal">
            <h2>Uh oh...</h2>
            <!-- Safari logo from Wikimedia Commons -->
            <img id="safari-logo" src="safari.svg">

            <img src="alwayshasbeen.png">
            <div class="modal-button-container">
                <a href="/artoftheweb/s1fp">OK</a>
            </div>
        </div>
    </div>
