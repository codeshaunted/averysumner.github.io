    <script>
        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

            const video = document.createElement("video");
            video.srcObject = stream;
            video.autoplay = true;

            const cameraDiv = document.getElementById("magazine-screen");
            cameraDiv.appendChild(video);
        }

        startCamera();

        const canvas = document.getElementById("tv-canvas");
        const ctx = canvas.getContext("2d");

        let isRunning = true;
        let density = 1.0;
        let frameRate = 30;
        let animationId;

        function generateStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < density) {
                    const gray = Math.random() * 255;
                    data[i] = gray; // red
                    data[i + 1] = gray; // green
                    data[i + 2] = gray; // blue
                    data[i + 3] = 255; // alpha
                } else {
                    data[i] = 0;
                    data[i + 1] = 0;
                    data[i + 2] = 0;
                    data[i + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function animate() {
            generateStatic();

            setTimeout(() => {
                animationId = requestAnimationFrame(animate);
            }, 1000 / frameRate);
        }

        animate();

        let magazineAddress = document.getElementById("magazine-address-text");

        magazineAddress.innerHTML = window.navigator.userAgent.toUpperCase();

    </script>
